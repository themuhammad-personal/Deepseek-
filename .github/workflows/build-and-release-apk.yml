name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - v3-real-exact-ui
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Releases (leave OFF for branch test builds)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Verify APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/**/gradle-wrapper.properties
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
      - name: Write Android local.properties
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
      - name: Install NPM Dependencies
        run: npm ci
      - name: Typecheck & Unit Tests
        run: |
          npm run typecheck
          npm run test:app
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Build React App for Android (SPA with hidden WebView + native bridge)
        run: |
          npm run build:android
          echo "=== Assets ==="
          ls -lh android/app/src/main/assets/
          ls -lh android/app/src/main/assets/assets/ | head -n 20
          ls -lh android/app/src/main/assets/ds/
      - name: Stage better-deepseek engine assets (after vite emptyOutDir wipe)
        run: |
          rm -rf android/app/src/main/assets/bds
          cp -r android/app/src/main/bds-assets/bds android/app/src/main/assets/bds
          echo "=== Engine assets staged ==="
          ls -lh android/app/src/main/assets/bds/
      - name: Make Gradle Wrapper Executable
        working-directory: android
        run: chmod +x ./gradlew
      - name: Run Android Unit Tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Setup Signing Keystore
        working-directory: android
        env:
          BDS_KEYSTORE: ${{ secrets.BDS_KEYSTORE }}
        run: |
          if [ -n "$BDS_KEYSTORE" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$BDS_KEYSTORE" | base64 --decode > ci-release.jks
          elif [ -f "app/superdeepseek-release.jks" ]; then
            echo "Using permanent Super DeepSeek release keystore..."
            cp app/superdeepseek-release.jks ci-release.jks
          else
            echo "Generating fallback release keystore..."
            keytool -genkeypair -v \
              -keystore ci-release.jks \
              -alias superdeepseek \
              -keyalg RSA \
              -keysize 2048 \
              -validity 20000 \
              -storepass superdeepseek \
              -keypass superdeepseek \
              -dname "CN=SuperDeepSeek, OU=Mobile, O=SuperDeepSeek, L=Dhaka, ST=Dhaka, C=BD"
          fi
          ls -la ci-release.jks
      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease -PbdsBuildId=${{ github.run_number }}
        env:
          BDS_KEYSTORE_PASSWORD: ${{ secrets.BDS_KEYSTORE_PASSWORD || 'superdeepseek' }}
          BDS_KEY_ALIAS: ${{ secrets.BDS_KEY_ALIAS || 'superdeepseek' }}
          BDS_KEY_PASSWORD: ${{ secrets.BDS_KEY_PASSWORD || 'superdeepseek' }}
      - name: Prepare APK and Compute Checksums
        id: prep
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          APK_RAW=$(find android/app/build/outputs/apk/release -name "*release*.apk" ! -name "*unaligned*" | head -n 1)
          if [ -z "$APK_RAW" ]; then
            APK_RAW=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_RAW" ]; then
            echo "Error: No release APK found in android/app/build/outputs/apk/release!"
            exit 1
          fi
          APK_NAME="super-deepseek-latest.apk"
          cp "$APK_RAW" "$APK_NAME"
          sha256sum "$APK_NAME" > "${APK_NAME}.sha256"
          echo "apk_path=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum_path=${APK_NAME}.sha256" >> "$GITHUB_OUTPUT"
          echo "--- Prepared Artifacts ---"
          ls -lh "$APK_NAME" "${APK_NAME}.sha256"
          cat "${APK_NAME}.sha256"
          echo "=== APK contents ==="
          unzip -l "$APK_NAME" | grep -E "assets/|android-spa|ds/" | head -n 20
      - name: Verify APK Signature
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "${{ steps.prep.outputs.apk_path }}"
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: super-deepseek-apk
          path: |
            *.apk
            *.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Release
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v3-real-exact-ui' || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: super-deepseek-apk
      - id: rel_cfg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"; echo "title=Super DeepSeek v${VERSION}" >> "$GITHUB_OUTPUT"; else echo "tag=latest" >> "$GITHUB_OUTPUT"; echo "title=Super DeepSeek (Continuous Build #${{ github.run_number }})" >> "$GITHUB_OUTPUT"; fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel_cfg.outputs.tag }}
          name: ${{ steps.rel_cfg.outputs.title }}
          body: |
            ### Super DeepSeek — same-origin DeepSeek client

            **Version:** `${{ steps.rel_cfg.outputs.version }}`
            **Build:** `${{ github.run_number }}`
            **Commit:** `${{ github.sha }}`

            #### What changed in this build

            Chat no longer goes through the WebView/Kotlin bridge. The SPA is served
            from `chat.deepseek.com` itself, so every `/api/v0/...` call is
            same-origin: no CORS preflight, real cookies, and traffic the API cannot
            tell apart from the official web app's.

            Only sign-in still uses the native WebView, because `POST /users/login`
            is the one endpoint behind the AWS WAF JS challenge. The token it
            produces is verified against `/users/current` before the app trusts it.

            Failures are now reported with their real cause instead of a blanket
            "DeepSeek is unavailable right now." See `docs/ARCHITECTURE.md` and
            `docs/DIAGNOSIS-AND-FIX-PLAN.md`.

            #### Features
            - Official DeepSeek email / phone sign-in, token verified on login
            - Direct DeepSeek API chat with WASM proof-of-work (DeepSeekHashV1)
            - DeepThink, web search, Deep Research, RAG, MCP, projects, memories
            - OLED dark UI, offline queue, artifacts

            Install on Android 8.0+ and sign in with your DeepSeek account.
          files: |
            *.apk
            *.sha256
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
